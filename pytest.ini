[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: smoke regression tests that validate the core user path
    functional: functional validation and business behavior checks
    exploratory: exploratory or AI showcase tests that demonstrate capability
    security: security-focused tests and checks
    performance: performance-sensitive tests
    contract: contract or integration payload validation
    requires_groq: mark test as requiring GROQ_API_KEY
    flaky: quarantined flaky test; requires an issue link and owner before re-enabling in normal CI
addopts = 
    -v
    --tb=short
    -m "not flaky"
    --browser=chromium
    --alluredir=allure-results
    --clean-alluredir